[uwsgi]

chdir           = /var/www/site_institucional_web
module          = core.wsgi
home            = /var/www/site_institucional_web/venv
master          = true
processes       = 10
socket          = /var/www/site_institucional_web/jorge.sock
chmod-socket    = 666
vacuum          = true
logto           = /var/log/uwsgi/jorge.log
logto2          = /var/log/uwsgi/jorge-err.log
