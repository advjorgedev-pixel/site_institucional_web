{% load static %}
{% load i18n %}

<section class="py-4">
    <div class="container-custom">
        <article class="card-base p-0 overflow-hidden" data-aos="fade-up" data-aos-delay="80">

            {% if post.cover %}
            <div class="ratio ratio-21x9 blog-cover">
                <img src="{{ post.cover.url }}" alt="{{ post_title }}" class="w-100 h-100 object-fit-cover">
            </div>
            {% endif %}

            <div class="p-4 p-lg-5">

                <!-- Ações -->
                <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
                    <a class="btn-outline" href="{% url 'blog_list' %}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-arrow-left" viewBox="0 0 16 16" aria-hidden="true">
                            <path fill-rule="evenodd"
                                d="M15 8a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 7.5H14.5A.5.5 0 0 1 15 8" />
                        </svg>
                        {% trans "Voltar" %}
                    </a>

                    <div class="d-flex flex-wrap gap-2">
                        <a class="btn-outline" href="https://wa.me/?text={{ request.build_absolute_uri|urlencode }}"
                            target="_blank" rel="noopener">
                            <i class="bi bi-whatsapp"></i> {% trans "Compartilhar" %}
                        </a>
                        <a class="btn-outline"
                            href="https://www.linkedin.com/sharing/share-offsite/?url={{ request.build_absolute_uri|urlencode }}"
                            target="_blank" rel="noopener">
                            <i class="bi bi-linkedin"></i> {% trans "LinkedIn" %}
                        </a>
                    </div>
                </div>

                <!-- Conteúdo -->
                <div class="blog-content">
                    {{ post_content|safe }}
                </div>

                <!-- Tags / Área -->
                <hr class="my-4">

                <div class="d-flex flex-wrap gap-2 align-items-center">
                    {% if post.area %}
                    <span class="text-white-50 small">{% trans "Área:" %}</span>
                    <a class="btn-outline" href="{% url 'blog_list' %}?area={{ post.area.slug|urlencode }}">
                        {{ post.area.name }}
                    </a>
                    {% endif %}
                </div>

            </div>
        </article>
    </div>
</section>
