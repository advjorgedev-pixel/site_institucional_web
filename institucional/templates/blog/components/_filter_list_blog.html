{% load static %}
{% load i18n %}

<section class="py-4">
    <div class="container-custom">

        <form method="get" class="card-base mb-4 filter-form" data-aos="fade-up" data-aos-delay="120">
            <div class="row g-3 align-items-center">
                <div class="col-12 col-lg-9">
                    <label class="form-label text-white mb-1">{% trans "Buscar no título" %}</label>
                    <input type="text" class="form-control" name="q" value="{{ q }}"
                        placeholder="{% trans 'Ex: ação revisional' %}">
                    <div class="form-text text-white-50">
                        {% trans "Separe por espaço. Todas as palavras devem aparecer no título." %}
                    </div>
                </div>

                <div class="col-12 col-lg-3 d-grid">
                    <button class="btn-primary" type="submit">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-funnel" viewBox="0 0 16 16" aria-hidden="true">
                            <path
                                d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z" />
                        </svg>
                        {% trans "Filtrar" %}
                    </button>
                </div>
            </div>
        </form>

        <div class="d-flex flex-wrap gap-2 mb-4" data-aos="fade-up" data-aos-delay="150">
            <a class="btn-outline {% if not area_selected %}active{% endif %}"
                href="{% url 'blog_list' %}?q={{ q|urlencode }}"
                aria-current="{% if not area_selected %}true{% endif %}">
                {% trans "Todas" %}
            </a>

            {% for area in areas %}
            <a class="btn-outline {% if area_selected == area.slug %}active{% endif %}"
                href="{% url 'blog_list' %}?q={{ q|urlencode }}&area={{ area.slug|urlencode }}"
                aria-current="{% if area_selected == area.slug %}true{% endif %}">
                {{ area.name }}
            </a>
            {% endfor %}
        </div>

    </div>
</section>
