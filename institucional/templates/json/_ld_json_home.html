          "@type": "Question",
          "name": "{% filter escapejs %}{% trans 'Como funciona a primeira consulta?' %}{% endfilter %}",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "{% filter escapejs %}{% blocktrans %}Você apresenta sua situação e os documentos disponíveis. Eu avalio o cenário, explico possibilidades, riscos e próximos passos. Se fizer sentido, definimos a estratégia e a forma de condução do caso.{% endblocktrans %}{% endfilter %}"

        {
          "@type": "Question",
          "name": "{% filter escapejs %}{% trans 'Quais documentos devo levar para a consulta?' %}{% endfilter %}",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "{% filter escapejs %}{% blocktrans %}Depende do tema, mas geralmente ajudam: RG/CPF, comprovantes, contratos, extratos, comunicações do banco/INSS, e qualquer documento que comprove a situação. Se faltar algo, eu oriento o que solicitar depois.{% endblocktrans %}{% endfilter %}"

            "@type": "Answer",

            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "{% filter escapejs %}{% trans 'O que é preciso para revisar juros abusivos ou contratos bancários?' %}{% endfilter %}",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "{% filter escapejs %}{% blocktrans %}Normalmente precisamos do contrato, demonstrativos, extratos, comprovantes de pagamento e eventuais renegociações. Com isso, é possível avaliar a legalidade de taxas e cláusulas.{% endblocktrans %}{% endfilter %}"
          }
        },
        {
          "@type": "Question",
          "name": "{% filter escapejs %}{% trans 'Posso pedir benefício previdenciário mesmo após indeferimento?' %}{% endfilter %}",

            "@type": "Answer",
            "text": "{% filter escapejs %}{% blocktrans %}Sim. Dependendo do motivo do indeferimento, podemos recorrer administrativamente ou ingressar com ação. Avalio o fundamento, documentos, laudos e histórico contributivo para definir a melhor estratégia.{% endblocktrans %}{% endfilter %}"
          }
        },
        {
          "@type": "Question",
          "name": "{% filter escapejs %}{% trans 'Como funciona inventário e partilha?' %}{% endfilter %}",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "{% filter escapejs %}{% blocktrans %}O inventário organiza bens, dívidas e herdeiros para formalizar a partilha. Pode ser judicial ou em cartório, conforme requisitos. Eu conduzo o processo e indico a via mais adequada para o seu cenário.{% endblocktrans %}{% endfilter %}"
          }
        },
        {
          "@type": "Question",
          "name": "{% filter escapejs %}{% trans 'Quando vale a pena fazer testamento?' %}{% endfilter %}",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "{% filter escapejs %}{% blocktrans %}O testamento é útil para organizar a vontade, reduzir conflitos e dar previsibilidade. Ele não elimina regras legais, mas ajuda muito no planejamento sucessório. Eu explico opções e limites de forma clara.{% endblocktrans %}{% endfilter %}"
          }
        },
        {
          "@type": "Question",
          "name": "{% filter escapejs %}{% trans 'Quais são as formas de honorários?' %}{% endfilter %}",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "{% filter escapejs %}{% blocktrans %}Os honorários variam conforme complexidade, urgência e modelo de atuação (consultivo, administrativo ou judicial). Eu apresento a proposta com clareza e alinhamos tudo antes de iniciar.{% endblocktrans %}{% endfilter %}"
          }
